name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  GO_VERSION: '1.24.x'
  DOCKER_BUILDKIT: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: make deps

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.64.8
          args: --timeout=10m --out-format=colored-line-number

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: make deps

      - name: Run tests
        run: make test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: make deps

      - name: Build binaries
        run: make build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/

  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub (if needed)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Controller
        id: meta-controller
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME || github.repository_owner }}/arca-lb-controller
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for Agent
        id: meta-agent
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME || github.repository_owner }}/arca-lb-agent
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Controller image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.controller
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-controller.outputs.tags }}
          labels: ${{ steps.meta-controller.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Agent image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.agent
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attach Dockerfiles to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deploy/docker/Dockerfile.controller
            deploy/docker/Dockerfile.agent

  release-artifacts:
    name: Attach Binaries to Release
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: [build]
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/bin

      - name: Package binaries
        run: |
          set -euo pipefail
          VERSION="${{ github.event.release.tag_name }}"
          PLATFORM="linux-amd64"
          ARCHIVE="arcalb-${VERSION}-${PLATFORM}.tar.gz"
          tar -C dist/bin -czf "dist/${ARCHIVE}" .
          (cd dist && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256")

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256

  release-containers:
    name: Attach Container Images to Release
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: [lint, test]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.controller
          load: true
          platforms: linux/amd64
          tags: arca-lb-controller:${{ github.event.release.tag_name }}

      - name: Build agent image (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.agent
          load: true
          platforms: linux/amd64
          tags: arca-lb-agent:${{ github.event.release.tag_name }}

      - name: Export images
        run: |
          set -euo pipefail
          VERSION="${{ github.event.release.tag_name }}"
          mkdir -p dist

          CONTROLLER_ARCHIVE="arca-lb-controller-${VERSION}-linux-amd64-image.tar.gz"
          AGENT_ARCHIVE="arca-lb-agent-${VERSION}-linux-amd64-image.tar.gz"

          docker save "arca-lb-controller:${VERSION}" | gzip -c > "dist/${CONTROLLER_ARCHIVE}"
          docker save "arca-lb-agent:${VERSION}" | gzip -c > "dist/${AGENT_ARCHIVE}"

          (cd dist && sha256sum "${CONTROLLER_ARCHIVE}" > "${CONTROLLER_ARCHIVE}.sha256")
          (cd dist && sha256sum "${AGENT_ARCHIVE}" > "${AGENT_ARCHIVE}.sha256")

      - name: Attach images to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256

  proto:
    name: Generate Protobuf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install protoc
        uses: arduino/setup-protoc@v1
        with:
          version: '3.20.3'

      - name: Install protoc-gen-go
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

      - name: Generate protobuf code
        run: make proto

      - name: Check for changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated protobuf files are out of date"
            git diff
            exit 1
          fi
