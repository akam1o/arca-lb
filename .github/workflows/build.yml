name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  GO_VERSION: '1.26.3'
  PYTHON_VERSION: '3.12'
  DOCKER_BUILDKIT: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: make deps

      - name: Run golangci-lint
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: make deps

      - name: Run tests
        run: make test

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella

  kubernetes-codegen:
    name: Kubernetes Code Generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Kubernetes generated artifacts
        run: make verify-generate

  vulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: make deps

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  octavia-driver-test:
    name: Octavia Driver Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.9.18"
          enable-cache: true
          cache-dependency-glob: octavia-driver/uv.lock

      - name: Install Octavia driver test dependencies
        working-directory: octavia-driver
        run: uv sync --locked --group dev

      - name: Run Octavia driver lint
        working-directory: octavia-driver
        run: uv run --locked --group dev ruff check octavia_arca_driver tests

      - name: Run Octavia driver type check
        working-directory: octavia-driver
        run: uv run --locked --group dev mypy

      - name: Run Octavia driver tests
        working-directory: octavia-driver
        run: uv run --locked --group dev python -m pytest --cov=octavia_arca_driver --cov-report=term-missing -q

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: make deps

      - name: Build binaries
        run: make build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/

  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: [lint, test, kubernetes-codegen, vulncheck, octavia-driver-test, build, proto]
    permissions:
      contents: write
      packages: write
    env:
      DOCKERHUB_ENABLED: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set variables
        id: vars
        run: |
          set -euo pipefail
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub (if needed)
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Operator
        id: meta-operator
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/arca-lb-operator
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for Agent
        id: meta-agent
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/arca-lb-agent
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Prepare image output directory
        run: mkdir -p dist

      - name: Build operator image tar (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.operator
          platforms: linux/amd64
          tags: ${{ steps.meta-operator.outputs.tags }}
          labels: ${{ steps.meta-operator.outputs.labels }}
          outputs: type=docker,dest=dist/arca-lb-operator-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push operator tags
        run: |
          set -euo pipefail
          docker load -i dist/arca-lb-operator-image.tar
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            docker push "${tag}"
          done <<< "${{ steps.meta-operator.outputs.tags }}"

      - name: Push operator tags to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        env:
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKER_USERNAME }}
          GHCR_OWNER: ${{ steps.vars.outputs.owner_lc }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            image="${tag#ghcr.io/${GHCR_OWNER}/}"
            dockerhub_tag="${DOCKERHUB_NAMESPACE}/${image}"
            docker tag "${tag}" "${dockerhub_tag}"
            docker push "${dockerhub_tag}"
          done <<< "${{ steps.meta-operator.outputs.tags }}"

      - name: Build agent image tar (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.agent
          platforms: linux/amd64
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          outputs: type=docker,dest=dist/arca-lb-agent-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push agent tags
        run: |
          set -euo pipefail
          docker load -i dist/arca-lb-agent-image.tar
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            docker push "${tag}"
          done <<< "${{ steps.meta-agent.outputs.tags }}"

      - name: Push agent tags to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        env:
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKER_USERNAME }}
          GHCR_OWNER: ${{ steps.vars.outputs.owner_lc }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            image="${tag#ghcr.io/${GHCR_OWNER}/}"
            dockerhub_tag="${DOCKERHUB_NAMESPACE}/${image}"
            docker tag "${tag}" "${dockerhub_tag}"
            docker push "${dockerhub_tag}"
          done <<< "${{ steps.meta-agent.outputs.tags }}"

      - name: Package image archives
        run: |
          set -euo pipefail
          VERSION="${{ github.event.release.tag_name }}"
          mkdir -p dist/out

          OPERATOR_ARCHIVE="arca-lb-operator-${VERSION}-linux-amd64-image.tar.gz"
          AGENT_ARCHIVE="arca-lb-agent-${VERSION}-linux-amd64-image.tar.gz"

          gzip -c dist/arca-lb-operator-image.tar > "dist/out/${OPERATOR_ARCHIVE}"
          gzip -c dist/arca-lb-agent-image.tar > "dist/out/${AGENT_ARCHIVE}"

          (cd dist/out && sha256sum "${OPERATOR_ARCHIVE}" > "${OPERATOR_ARCHIVE}.sha256")
          (cd dist/out && sha256sum "${AGENT_ARCHIVE}" > "${AGENT_ARCHIVE}.sha256")

      - name: Attach Dockerfiles to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deploy/docker/Dockerfile.operator
            deploy/docker/Dockerfile.agent
            dist/out/*.tar.gz
            dist/out/*.sha256

  release-artifacts:
    name: Attach Binaries to Release
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: [lint, test, kubernetes-codegen, vulncheck, octavia-driver-test, build, proto]
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/bin

      - name: Package binaries
        run: |
          set -euo pipefail
          VERSION="${{ github.event.release.tag_name }}"
          PLATFORM="linux-amd64"
          ARCHIVE="arcalb-${VERSION}-${PLATFORM}.tar.gz"
          tar -C dist/bin -czf "dist/${ARCHIVE}" .
          (cd dist && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256")

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256


  proto:
    name: Generate Protobuf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install protoc
        uses: arduino/setup-protoc@v1
        with:
          version: '3.20.3'

      - name: Install protoc-gen-go
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

      - name: Generate protobuf code
        run: make proto

      - name: Check for changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated protobuf files are out of date"
            git diff
            exit 1
          fi
