---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: virtualips.arca.io
spec:
  group: arca.io
  names:
    kind: VirtualIP
    listKind: VirtualIPList
    plural: virtualips
    shortNames:
    - vip
    singular: virtualip
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.address
      name: Address
      type: string
    - jsonPath: .spec.port
      name: Port
      type: integer
    - jsonPath: .spec.protocol
      name: Protocol
      type: string
    - jsonPath: .status.healthyBackends
      name: Healthy
      type: integer
    - jsonPath: .status.totalBackends
      name: Total
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VirtualIP is a Layer 4 virtual IP managed by arca-lb.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VirtualIPSpec defines the desired state of a VirtualIP.
            properties:
              address:
                description: Address is the virtual IP address.
                format: ip
                type: string
              backends:
                description: Backends is the list of real servers.
                items:
                  description: BackendSpec defines a real server backing a VIP.
                  properties:
                    address:
                      description: Address is the IP address of the backend server.
                      format: ip
                      type: string
                    monitorAddress:
                      description: |-
                        MonitorAddress is an optional alternate IP address used only for health checks.
                        When omitted, health checks probe Address.
                      format: ip
                      type: string
                    weight:
                      default: 1
                      description: |-
                        Weight records the desired proportion of traffic sent to this backend (1-100).
                        Defaults to 1 when omitted.
                        The VPP LB plugin path currently stores this as metadata; weighted AS
                        programming will take effect once the VPP LB API exposes backend weights.
                      maximum: 100
                      minimum: 1
                      type: integer
                  required:
                  - address
                  type: object
                type: array
                x-kubernetes-validations:
                - message: spec.backends addresses must be unique
                  rule: self.all(b1, self.exists_one(b2, b2.address == b1.address))
              dscp:
                description: |-
                  DSCP is an optional DSCP override for DSCP-based L3DSR steering.
                  When omitted, the agent's dataplane.vpp.dscp default is used.
                maximum: 63
                minimum: 1
                type: integer
              encapType:
                default: L3DSR
                description: EncapType is the encapsulation type for return traffic.
                enum:
                - GRE4
                - GRE6
                - L3DSR
                - NAT4
                - NAT6
                type: string
              healthCheck:
                description: HealthCheck configures health checking for the backends.
                properties:
                  fallCount:
                    default: 2
                    description: FallCount is the number of consecutive failures to
                      mark a backend unhealthy.
                    maximum: 2147483647
                    minimum: 1
                    type: integer
                  http:
                    description: HTTP contains HTTP/HTTPS-specific probe settings.
                    properties:
                      expectedCodes:
                        description: ExpectedCodes is the set of HTTP status codes
                          that indicate success.
                        items:
                          maximum: 599
                          minimum: 100
                          type: integer
                        type: array
                      headers:
                        additionalProperties:
                          type: string
                        description: Headers are additional HTTP headers to send.
                        type: object
                      host:
                        description: Host sets the Host header for the probe request.
                        type: string
                      method:
                        default: GET
                        description: Method is the HTTP method.
                        enum:
                        - GET
                        - HEAD
                        - POST
                        type: string
                      path:
                        default: /
                        description: Path is the HTTP path to probe.
                        pattern: ^/($|[^/].*)
                        type: string
                      port:
                        description: Port is the target port for the HTTP request.
                        maximum: 65535
                        minimum: 1
                        type: integer
                      skipTLSVerify:
                        description: SkipTLSVerify skips TLS certificate verification
                          (HTTPS only).
                        type: boolean
                    required:
                    - port
                    type: object
                  intervalSeconds:
                    default: 5
                    description: IntervalSeconds is the time between probes.
                    maximum: 2147483647
                    minimum: 1
                    type: integer
                  riseCount:
                    default: 3
                    description: RiseCount is the number of consecutive successes
                      to mark a backend healthy.
                    maximum: 2147483647
                    minimum: 1
                    type: integer
                  tcp:
                    description: TCP contains TCP-specific probe settings.
                    properties:
                      expectedResponse:
                        description: ExpectedResponse is an optional substring expected
                          in the response.
                        type: string
                      port:
                        description: Port is the target port for the TCP connection.
                        maximum: 65535
                        minimum: 1
                        type: integer
                      send:
                        description: Send is optional data to send after connection.
                        type: string
                    required:
                    - port
                    type: object
                  timeoutSeconds:
                    default: 3
                    description: TimeoutSeconds is the maximum time to wait for a
                      probe response.
                    maximum: 2147483647
                    minimum: 1
                    type: integer
                  type:
                    description: Type is the probe type.
                    enum:
                    - http
                    - https
                    - tcp
                    - ping
                    - tls-hello
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: spec.healthCheck.http is required for type http or https
                  rule: (self.type != 'http' && self.type != 'https') || has(self.http)
                - message: spec.healthCheck.tcp is required for type tcp or tls-hello
                  rule: (self.type != 'tcp' && self.type != 'tls-hello') || has(self.tcp)
                - message: spec.healthCheck.timeoutSeconds must be less than intervalSeconds
                  rule: '(has(self.timeoutSeconds) ? self.timeoutSeconds : 3) < (has(self.intervalSeconds)
                    ? self.intervalSeconds : 5)'
              port:
                description: Port is the virtual port.
                maximum: 65535
                minimum: 1
                type: integer
              protocol:
                description: Protocol is the transport protocol.
                enum:
                - TCP
                - UDP
                type: string
            required:
            - address
            - port
            - protocol
            type: object
            x-kubernetes-validations:
            - message: spec.encapType L3DSR/NAT4 requires an IPv4 spec.address
              rule: '!has(self.encapType) || (self.encapType != ''L3DSR'' && self.encapType
                != ''NAT4'') || self.address.matches(''^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$'')'
            - message: spec.encapType NAT6 requires an IPv6 spec.address
              rule: '!has(self.encapType) || self.encapType != ''NAT6'' || !self.address.matches(''^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$'')'
            - message: spec.backends addresses must be IPv4 for GRE4/L3DSR/NAT4 encapType
              rule: '!has(self.encapType) || (self.encapType != ''GRE4'' && self.encapType
                != ''L3DSR'' && self.encapType != ''NAT4'') || !has(self.backends)
                || self.backends.all(be, be.address.matches(''^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$''))'
            - message: spec.backends addresses must be IPv6 for GRE6/NAT6 encapType
              rule: '!has(self.encapType) || (self.encapType != ''GRE6'' && self.encapType
                != ''NAT6'') || !has(self.backends) || self.backends.all(be, !be.address.matches(''^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$''))'
          status:
            description: VirtualIPStatus defines the observed state of a VirtualIP.
            properties:
              agentStatuses:
                description: AgentStatuses contains per-agent observations used to
                  build the aggregate status.
                items:
                  description: AgentStatus reports one agent's observation of a VirtualIP.
                  properties:
                    agentID:
                      description: AgentID identifies the reporting agent, typically
                        the Kubernetes node name.
                      type: string
                    backends:
                      description: Backends reports per-backend health status observed
                        by this agent.
                      items:
                        description: BackendStatus reports the health state of a single
                          backend.
                        properties:
                          address:
                            description: Address is the IP address of the backend.
                            type: string
                          healthy:
                            description: Healthy indicates whether the backend is
                              currently healthy.
                            type: boolean
                          lastProbeTime:
                            description: LastProbeTime is the timestamp of the most
                              recent probe.
                            format: date-time
                            type: string
                          message:
                            description: Message provides human-readable details.
                            type: string
                        required:
                        - address
                        - healthy
                        type: object
                      maxItems: 1024
                      type: array
                    conditions:
                      description: Conditions represent this agent's latest observations.
                      items:
                        description: Condition contains details for one aspect of
                          the current state of this API Resource.
                        properties:
                          lastTransitionTime:
                            description: |-
                              lastTransitionTime is the last time the condition transitioned from one status to another.
                              This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                            format: date-time
                            type: string
                          message:
                            description: |-
                              message is a human readable message indicating details about the transition.
                              This may be an empty string.
                            maxLength: 32768
                            type: string
                          observedGeneration:
                            description: |-
                              observedGeneration represents the .metadata.generation that the condition was set based upon.
                              For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                              with respect to the current state of the instance.
                            format: int64
                            minimum: 0
                            type: integer
                          reason:
                            description: |-
                              reason contains a programmatic identifier indicating the reason for the condition's last transition.
                              Producers of specific condition types may define expected values and meanings for this field,
                              and whether the values are considered a guaranteed API.
                              The value should be a CamelCase string.
                              This field may not be empty.
                            maxLength: 1024
                            minLength: 1
                            pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                            type: string
                          status:
                            description: status of the condition, one of True, False,
                              Unknown.
                            enum:
                            - "True"
                            - "False"
                            - Unknown
                            type: string
                          type:
                            description: type of condition in CamelCase or in foo.example.com/CamelCase.
                            maxLength: 316
                            pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                            type: string
                        required:
                        - lastTransitionTime
                        - message
                        - reason
                        - status
                        - type
                        type: object
                      type: array
                    healthyBackendBitmap:
                      description: |-
                        HealthyBackendBitmap encodes healthy backend positions from the observed
                        spec.backends list so aggregate counts can remain exact when Backends is
                        capped for status size.
                      type: string
                    healthyBackends:
                      description: HealthyBackends is the number of healthy backends
                        observed by this agent.
                      type: integer
                    lastUpdateTime:
                      description: LastUpdateTime is when this agent observation was
                        written.
                      format: date-time
                      type: string
                    observedGeneration:
                      description: ObservedGeneration is the VirtualIP generation
                        observed by this agent.
                      format: int64
                      type: integer
                    totalBackends:
                      description: TotalBackends is the total number of configured
                        backends observed by this agent.
                      type: integer
                    ttlSeconds:
                      description: TTLSeconds is how long this observation should
                        remain valid.
                      format: int64
                      maximum: 3600
                      minimum: 1
                      type: integer
                  required:
                  - agentID
                  - healthyBackends
                  - totalBackends
                  type: object
                maxItems: 256
                type: array
                x-kubernetes-list-map-keys:
                - agentID
                x-kubernetes-list-type: map
              backends:
                description: Backends reports per-backend health status.
                items:
                  description: BackendStatus reports the health state of a single
                    backend.
                  properties:
                    address:
                      description: Address is the IP address of the backend.
                      type: string
                    healthy:
                      description: Healthy indicates whether the backend is currently
                        healthy.
                      type: boolean
                    lastProbeTime:
                      description: LastProbeTime is the timestamp of the most recent
                        probe.
                      format: date-time
                      type: string
                    message:
                      description: Message provides human-readable details.
                      type: string
                  required:
                  - address
                  - healthy
                  type: object
                maxItems: 1024
                type: array
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              healthyBackends:
                description: HealthyBackends is the number of healthy backends.
                type: integer
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the operator.
                format: int64
                type: integer
              totalBackends:
                description: TotalBackends is the total number of configured backends.
                type: integer
            required:
            - healthyBackends
            - totalBackends
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
