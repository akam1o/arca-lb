---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: virtualips.arca.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.0
spec:
  group: arca.io
  names:
    kind: VirtualIP
    listKind: VirtualIPList
    plural: virtualips
    singular: virtualip
    shortNames:
      - vip
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Address
          type: string
          jsonPath: .spec.address
        - name: Port
          type: integer
          jsonPath: .spec.port
        - name: Protocol
          type: string
          jsonPath: .spec.protocol
        - name: Healthy
          type: integer
          jsonPath: .status.healthyBackends
        - name: Total
          type: integer
          jsonPath: .status.totalBackends
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: VirtualIP is a Layer 4 virtual IP managed by arca-lb.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - address
                - port
                - protocol
              properties:
                address:
                  type: string
                  description: Virtual IP address.
                  format: ip
                port:
                  type: integer
                  description: Virtual port number.
                  minimum: 1
                  maximum: 65535
                protocol:
                  type: string
                  description: Transport protocol.
                  enum:
                    - TCP
                    - UDP
                encapType:
                  type: string
                  description: Encapsulation type for return traffic.
                  default: L3DSR
                  enum:
                    - GRE4
                    - GRE6
                    - L3DSR
                    - NAT4
                    - NAT6
                dscp:
                  type: integer
                  description: DSCP value for L3DSR (1-63).
                  minimum: 0
                  maximum: 63
                backends:
                  type: array
                  description: List of real servers.
                  items:
                    type: object
                    required:
                      - address
                    properties:
                      address:
                        type: string
                        format: ip
                      weight:
                        type: integer
                        default: 100
                        minimum: 1
                        maximum: 100
                healthCheck:
                  type: object
                  description: Health checking configuration.
                  required:
                    - type
                  properties:
                    type:
                      type: string
                      enum:
                        - http
                        - https
                        - tcp
                        - ping
                    intervalSeconds:
                      type: integer
                      default: 5
                      minimum: 1
                    timeoutSeconds:
                      type: integer
                      default: 3
                      minimum: 1
                    riseCount:
                      type: integer
                      default: 3
                      minimum: 1
                    fallCount:
                      type: integer
                      default: 2
                      minimum: 1
                    http:
                      type: object
                      properties:
                        port:
                          type: integer
                          minimum: 1
                          maximum: 65535
                        path:
                          type: string
                          default: /
                        method:
                          type: string
                          default: GET
                          enum:
                            - GET
                            - HEAD
                            - POST
                        host:
                          type: string
                        headers:
                          type: object
                          additionalProperties:
                            type: string
                        expectedCodes:
                          type: array
                          items:
                            type: integer
                        skipTLSVerify:
                          type: boolean
                    tcp:
                      type: object
                      properties:
                        port:
                          type: integer
                          minimum: 1
                          maximum: 65535
                        send:
                          type: string
                        expectedResponse:
                          type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                healthyBackends:
                  type: integer
                totalBackends:
                  type: integer
                backends:
                  type: array
                  items:
                    type: object
                    properties:
                      address:
                        type: string
                      healthy:
                        type: boolean
                      lastProbeTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - reason
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
