---
apiVersion: v1
kind: Namespace
metadata:
  name: arca-lb-system
  labels:
    app.kubernetes.io/part-of: arca-lb
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arca-lb-operator
  namespace: arca-lb-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arca-lb-operator
  namespace: arca-lb-system
  labels:
    app.kubernetes.io/name: arca-lb-operator
    app.kubernetes.io/part-of: arca-lb
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: arca-lb-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arca-lb-operator
    spec:
      serviceAccountName: arca-lb-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: arcalb-operator:latest
          args:
            - --leader-elect
            - --metrics-bind-address=127.0.0.1:8080
            - --health-probe-bind-address=:8081
            - --enable-webhooks=false
            - --agent-status-ttl=2m
            - --agent-status-prune-interval=1m
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
