---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arca-lb-operator
rules:
  # VirtualIP CRD full access
  - apiGroups:
      - arca.io
    resources:
      - virtualips
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - arca.io
    resources:
      - virtualips/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - arca.io
    resources:
      - virtualips/finalizers
    verbs:
      - update
  # Leader election
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arca-lb-agent
rules:
  # VirtualIP read + status update
  - apiGroups:
      - arca.io
    resources:
      - virtualips
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - arca.io
    resources:
      - virtualips/status
    verbs:
      - get
      - update
      - patch
