# arca-lb Agent Configuration
#
# This file configures the arca-lb agent that runs on each load balancer node.
# Environment variables override values here (see env var names in comments).

agent:
  # Agent ID. Defaults to hostname if empty. (ARCA_AGENT_ID)
  id: ""
  # Path to bbolt database for local state persistence.
  storePath: /var/lib/arca-lb/agent.db
  # Safety-net reconciliation interval. Events trigger immediate reconcile.
  reconcileInterval: 30s

kubernetes:
  # Path to kubeconfig file. Empty uses in-cluster config. (ARCA_KUBECONFIG)
  kubeconfig: ""
  # Namespace to watch. Empty watches all namespaces. (ARCA_NAMESPACE)
  namespace: ""
  # Informer resync interval.
  resyncInterval: 30s

dataplane:
  # Data plane type: "vpp" (production) or "noop" (testing). (ARCA_DATAPLANE_TYPE)
  type: vpp
  vpp:
    socket_path: /run/vpp/api.sock
    encap_type: L3DSR
    dscp: 10
    service_type: CLUSTERIP
    new_flows_table_length: 65537

routing:
  # Enable BGP route management via FRR.
  enabled: true
  # Router type: "frr" or "noop".
  type: frr
  vtyshPath: /usr/bin/vtysh
  routeTag: 10000
  cmdTimeout: 10s

healthCheck:
  workerCount: 4
  maxConcurrentChecks: 64
  defaultTimeout: 3s

metrics:
  enabled: true
  address: ":9090"  # (ARCA_METRICS_ADDRESS)
  path: /metrics

telemetry:
  # OTLP gRPC endpoint for traces. Empty disables tracing. (ARCA_OTLP_ENDPOINT)
  otlpEndpoint: ""

log:
  level: info   # debug, info, warn, error
  format: json  # json, text
