server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  read_header_timeout: 5s
  idle_timeout: 60s
  max_header_bytes: 1048576  # 1 MB
  allowed_origins:
    - "http://localhost:3000"
    # - "https://yourdomain.com"  # Add production domains here

datastore:
  type: "etcd" # "etcd" or "mysql"

  # etcd configuration
  etcd:
    endpoints:
      - "localhost:2379"
    key_prefix: "/arca-lb"
    tls: false
    # cert_file: "/path/to/cert.pem"
    # key_file: "/path/to/key.pem"
    # ca_file: "/path/to/ca.pem"
    dial_timeout: 5s
    request_timeout: 3s

  # MySQL configuration
  # NOTE: Use environment variables or secrets management for passwords in production
  mysql:
    host: "localhost"
    port: 3306
    user: "arcalb"
    password: "arcalb"  # CHANGE THIS - use ENV var like ${MYSQL_PASSWORD}
    database: "arcalb"

grpc:
  host: "0.0.0.0"
  port: 50051
  tls: false

log:
  level: "info" # "debug", "info", "warn", "error"
  format: "json" # "json" or "text"
