# arca-lb v2 is Kubernetes-native. This compose file is an image and
# entrypoint smoke test; it intentionally does not start the removed v1
# controller/gRPC stack.

services:
  operator:
    image: arcalb-operator:latest
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.operator
    command: ["--help"]
    healthcheck:
      disable: true

  agent:
    image: arcalb-agent:latest
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.agent
    command: ["--help"]
    healthcheck:
      disable: true
