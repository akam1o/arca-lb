apiVersion: v1
kind: ConfigMap
metadata:
  name: arcalb-agent-config
  namespace: arca-lb
data:
  agent.yaml: |
    agent:
      id: "k8s-agent"
      metadata:
        environment: "kubernetes"
      reconcile_interval: 30s
      heartbeat_interval: 10s

    controller:
      address: "arcalb-controller.arca-lb.svc.cluster.local:50051"
      timeout: 10s
      max_retries: 5
      retry_backoff: 1s
      max_retry_backoff: 30s
      tls:
        enabled: false
        cert_file: "/etc/arca-lb/certs/agent.crt"
        key_file: "/etc/arca-lb/certs/agent.key"
        ca_file: "/etc/arca-lb/certs/ca.crt"
        insecure_skip_verify: false

    vpp:
      socket_path: "/run/vpp/api.sock"
      connect_timeout: 10s
      reconnect_interval: 30s
      max_reconnect_attempts: 0
      lb:
        encap_type: "GRE4"
        dscp: 1
        type: "CLUSTERIP"
        new_flows_table_length: 1024
        fail_on_all_backends_down: false

    frr:
      enabled: false
      vtysh: "/usr/bin/vtysh"
      config_file: "/etc/frr/frr.conf"

    health_check:
      worker_count: 4
      default_timeout: 3s
      max_concurrent_checks: 100

    log:
      level: "info"
      format: "json"
      output: "stdout"

    metrics:
      enabled: true
      listen_address: "0.0.0.0:9090"
      path: "/metrics"
      timeout: 10s
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: arcalb-agent
  namespace: arca-lb
  labels:
    app: arcalb-agent
spec:
  selector:
    matchLabels:
      app: arcalb-agent
  template:
    metadata:
      labels:
        app: arcalb-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: agent
        image: arcalb-agent:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
          capabilities:
            add:
              - NET_ADMIN
              - SYS_ADMIN
        ports:
        - name: metrics
          containerPort: 9090
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: vpp-api
          mountPath: /run/vpp/api.sock
        - name: vpp-stats
          mountPath: /run/vpp/stats.sock
        env:
        - name: ARCA_AGENT_CONFIG
          value: /app/config/agent.yaml
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: arcalb-agent-config
      - name: vpp-api
        hostPath:
          path: /run/vpp/api.sock
          type: Socket
      - name: vpp-stats
        hostPath:
          path: /run/vpp/stats.sock
          type: Socket
---
apiVersion: v1
kind: Service
metadata:
  name: arcalb-agent
  namespace: arca-lb
  labels:
    app: arcalb-agent
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  selector:
    app: arcalb-agent
