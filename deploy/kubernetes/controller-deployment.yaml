apiVersion: v1
kind: Namespace
metadata:
  name: arca-lb
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: arcalb-controller-config
  namespace: arca-lb
data:
  controller.yaml: |
    server:
      host: "0.0.0.0"
      port: 8080
    grpc:
      host: "0.0.0.0"
      port: 50051
    datastore:
      type: "etcd"
      etcd:
        endpoints:
          - "http://etcd:2379"
    log:
      level: "info"
      format: "json"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcalb-controller
  namespace: arca-lb
  labels:
    app: arcalb-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arcalb-controller
  template:
    metadata:
      labels:
        app: arcalb-controller
    spec:
      containers:
      - name: controller
        image: arcalb-controller:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: grpc
          containerPort: 50051
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        env:
        - name: CONFIG_PATH
          value: /app/config/controller.yaml
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: arcalb-controller-config
---
apiVersion: v1
kind: Service
metadata:
  name: arcalb-controller
  namespace: arca-lb
  labels:
    app: arcalb-controller
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  - name: grpc
    port: 50051
    targetPort: grpc
    protocol: TCP
  selector:
    app: arcalb-controller

