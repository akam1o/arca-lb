[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "octavia-arca-driver"
version = "0.1.0"
description = "Octavia provider driver for ArcaLB (VPP-based L3DSR Load Balancer)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
classifiers = [
    "Environment :: OpenStack",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]
dependencies = [
    "octavia-lib>=3.0.0",
    "kubernetes>=28.0.0",
    "oslo.config>=9.0.0",
    "oslo.log>=5.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18.0,<2.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.17",
]

[project.entry-points."octavia.api.drivers"]
arca = "octavia_arca_driver.driver:ArcaLBDriver"

[tool.setuptools.packages.find]
include = ["octavia_arca_driver*"]

[tool.mypy]
python_version = "3.9"
files = ["octavia_arca_driver"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.coverage.run]
source = ["octavia_arca_driver"]

[tool.coverage.report]
fail_under = 70
skip_empty = true
